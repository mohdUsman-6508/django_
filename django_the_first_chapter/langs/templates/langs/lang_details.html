{% extends "base.html" %} {% block content %}

<div class="min-h-screen bg-gray-100 py-10 px-4">
  <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
    <!-- Header -->
    <div class="bg-sky-500 text-white p-6">
      <h1 class="text-3xl font-bold">Language Details</h1>
      <p class="text-sky-100 mt-1">
        Explore information about this programming language
      </p>
    </div>

    <!-- Content -->
    <div class="p-8">
      <!-- Image -->
      <div class="flex justify-center mb-6">
        <img
          src="{{ lang.logo.url }}"
          alt="lang_logo"
          class="w-48 h-48 object-contain rounded-xl shadow-md bg-gray-50 p-4"
        />
      </div>

      <!-- Name -->
      <h2 class="text-4xl font-bold text-center text-gray-800 mb-4">
        {{ lang.name }}
      </h2>

      <!-- Type Badge -->
      <div class="flex justify-center mb-6">
        <span
          class="bg-sky-100 text-sky-700 px-4 py-2 rounded-full text-sm font-semibold"
        >
          {{ lang.lang_type }}
        </span>
      </div>

      <!-- Description -->
      <div class="bg-gray-50 rounded-xl p-6 shadow-sm">
        <h3 class="text-xl font-semibold text-gray-700 mb-3">Description</h3>

        <p class="text-gray-600 leading-relaxed">{{ lang.description }}</p>
      </div>

      <!-- Back Button -->
      <div class="mt-8 flex justify-center">
        <a href="{% url 'langs' %}">
          <button
            type="button"
            class="bg-sky-500 hover:bg-sky-600 transition duration-300 text-white px-6 py-3 rounded-xl shadow-md font-medium"
          >
            ← Back
          </button>
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
