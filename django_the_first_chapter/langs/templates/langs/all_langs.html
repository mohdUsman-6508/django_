{% extends "base.html" %} {% block content %}

<div class="min-h-screen bg-gray-100 py-10 px-4">
  <!-- Page Heading -->
  <div class="text-center mb-10">
    <h1 class="text-5xl font-bold text-sky-600 mb-3">Programming Languages</h1>

    <p class="text-gray-600 text-lg">
      Explore different programming languages and their details
    </p>
  </div>

  <!-- Grid Container -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"
  >
    {% for lang in langs %}

    <!-- Card -->
    <div
      class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300 transform hover:-translate-y-2"
    >
      <!-- Logo -->
      <div class="bg-gray-50 flex justify-center items-center h-56 p-6">
        <img
          src="{{ lang.logo.url }}"
          alt="{{ lang.name }}"
          class="h-40 object-contain"
        />
      </div>

      <!-- Card Content -->
      <div class="p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-3">{{ lang.name }}</h2>

        <span
          class="inline-block bg-sky-100 text-sky-700 text-sm font-semibold px-3 py-1 rounded-full mb-4"
        >
          {{ lang.lang_type }}
        </span>

        <p class="text-gray-600 mb-6 line-clamp-3">{{ lang.description }}</p>

        <!-- Button -->
        <a href="{% url 'lang_detail' lang.id %}">
          <button
            type="button"
            class="w-full bg-sky-500 hover:bg-sky-600 text-white py-3 rounded-xl font-medium transition duration-300 shadow-md"
          >
            More Details →
          </button>
        </a>
      </div>
    </div>

    {% endfor %}
  </div>
</div>

{% endblock %}
